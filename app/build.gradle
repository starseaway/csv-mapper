plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.jetbrains.kotlin.android)
    alias(libs.plugins.kapt)
}

android {
    namespace 'com.xinyi.app.csvmapper'
    compileSdk 36

    defaultConfig {
        applicationId "com.xinyi.app.csvmapper"

        minSdk 19
        targetSdk 36
        versionCode 1
        versionName "1.0"
        multiDexEnabled = true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        dataBinding = true
        buildConfig = true
    }
}

dependencies {
    implementation(libs.androidx.core.ktx)
    implementation(libs.androidx.appcompat)
    implementation(libs.material)
    implementation(libs.androidx.constraintlayout)
    testImplementation(libs.junit)
    androidTestImplementation(libs.androidx.junit)
    androidTestImplementation(libs.androidx.espresso.core)
    // 添加多DEX支持
    implementation(libs.androidx.multidex)

    // Android 项目基础库：https://github.com/starseaway/android-basic
    implementation libs.android.basic
    // Android 设备工具包：https://github.com/starseaway/device-toolkit
    implementation libs.device.toolkit
    // Android 文件工具包：https://github.com/starseaway/file-toolkit
    implementation libs.file.toolkit
    // 任务调度框架：https://github.com/starseaway/task-beehive
    implementation libs.task.beehive

    // 今日头条屏幕适配方案的终极版，一个极低成本的 Android 屏幕适配方案
    // 开源地址: https://github.com/JessYanCoding/AndroidAutoSize
    implementation libs.androidautosize

    // 沉浸式框架
    // 开源地址: https://github.com/gyf-dev/ImmersionBar
    implementation(libs.immersionbar)

    implementation(project(":library"))
}